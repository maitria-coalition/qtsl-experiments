[benchmark]
name = "faulty_regions"
family = "unreliable_hardware"
section = 1
provenance = "reconstruction candidate it.3 (zero-drift walk, region-dependent fault); negative-fingerprint + envelope validated only"
state = ["i", "error"]
init = {i = 7, error = 0}
guard = "i < 10"
assertion = "error == 0"

[[benchmark.dynamics]]
region = "4 <= i && i <= 6"
branches = [
  {prob = "1/500",   update = {error = "1"}},
  {prob = "499/1000", update = {i = "i + 1"}},
  {prob = "499/1000", update = {i = "i - 1"}},
]

[[benchmark.dynamics]]
region = "i >= 1"
branches = [
  {prob = "1/5000",    update = {error = "1"}},
  {prob = "4999/10000", update = {i = "i + 1"}},
  {prob = "4999/10000", update = {i = "i - 1"}},
]

[[benchmark.dynamics]]
region = "i < 1"
branches = [
  {prob = "1/5000",    update = {error = "1"}},
  {prob = "4999/10000", update = {i = "i + 1"}},
  {prob = "4999/10000", update = {}},
]

[benchmark.farkas]
published = "none"
grid = {i = [0, 10], error = [0, 1]}
invariant = "0 <= i && i <= 10"
target = "error >= 1"
objective = {i = 7, error = 0}
note = "Negative fingerprint expected AND mechanically guaranteed: zero drift forces the error-coefficient <= 0; LP optimum = 1."

[benchmark.truth]
method = "chain"
