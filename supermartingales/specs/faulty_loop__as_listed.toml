# ALTERNATE: verbatim-listing instance (init i=0). The paper's lst:faulty prints
# `i = 0`; this instance's exact true probability 1-(999/1001)^10 = 0.019801...
# exceeds all three of their published bounds for the row, which is the core of
# the adjudication (see faulty_loop.toml header; adjudication note workshop-side).
[benchmark]
name = "faulty_loop__as_listed"
family = "unreliable_hardware"
section = 3
provenance = "listing verbatim (v7 l.1068-1083), init i=0 as printed"
role = "refuted-listing-instance"  # envelope violation EXPECTED: that violation IS the adjudication finding
state = ["i", "error"]
init = {i = 0, error = 0}
guard = "i < 10"
assertion = "error == 0"

[[benchmark.dynamics]]
region = "true"
branches = [
  {prob = "1/1000",   update = {error = "1"}},
  {prob = "999/2000", update = {i = "i + 1"}},
  {prob = "999/2000", update = {}},
]

[benchmark.farkas]
published = "0.0181"
grid = {i = [0, 9], error = [0, 1]}
invariant = "0 <= i && i <= 9"
target = "error >= 1"
objective = {i = 0, error = 0}
note = "X-frame at listed init: invariant = integer guard region (exit i=10 excluded — the non-inductive 'exit hole' their published cliff surface exhibits). Expected optimum 2/111 (same value as primary, by translation degeneracy)."

[benchmark.truth]
method = "chain"
