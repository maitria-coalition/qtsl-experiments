# ALTERNATE candidate for faulty_varying: fault rate 1/100 only at the last
# counter value (i=9), 1/1000 elsewhere. Same LP worst-region => same Farkas
# fingerprint 2/11; true p ~ 0.035 (looser under their neural bounds than the
# primary's ~0.070). See faulty_varying.toml header.
[benchmark]
name = "faulty_varying__last_step"
family = "unreliable_hardware"
section = 2
provenance = "reconstruction alternate for faulty_varying"
state = ["i", "error"]
init = {i = 1, error = 0}
guard = "i < 10"
assertion = "error == 0"

[[benchmark.dynamics]]
region = "i < 9"
branches = [
  {prob = "1/1000",   update = {error = "1"}},
  {prob = "999/2000", update = {i = "i + 1"}},
  {prob = "999/2000", update = {}},
]

[[benchmark.dynamics]]
region = "i >= 9"
branches = [
  {prob = "1/100",  update = {error = "1"}},
  {prob = "99/200", update = {i = "i + 1"}},
  {prob = "99/200", update = {}},
]

[benchmark.farkas]
published = "0.1819"
grid = {i = [0, 10], error = [0, 1]}
invariant = "0 <= i && i <= 10"
target = "error >= 1"
objective = {i = 1, error = 0}
note = "Y-frame. Expected optimum 2/11 (same worst region)."

[benchmark.truth]
method = "chain"
