# RECONSTRUCTION (no listing). Faulty variant of ndecr (SAS'10 suite). Farkas
# fingerprint pins effective advance count D = 28 with the family race:
# 28 * (1/1000)/(999/2000) = 56/999 = 0.0560560... -> ceil 0.0561 = published.
# Structural twin with identical LP value: deterministic advance with D = 56
# (56/999 also); the two candidates' true probabilities differ by ~2e-5
# (1-(999/1001)^28 vs 1-(999/1000)^56), both inside the neural envelope — the
# ambiguity is real but numerically inconsequential. Primary = race-D28 (the
# faulty_* family template always carries the q-coin; deterministic advance is
# fixed_loop's marker), twin noted here rather than split into a file because
# no wave-1 deliverable changes across it.
[benchmark]
name = "faulty_ndecr"
family = "unreliable_hardware"
section = 3
provenance = "reconstruction; D=28 pinned by Farkas fingerprint (det-D56 twin noted); SAS'10 ndecr lineage"
state = ["i", "error"]
init = {i = 1, error = 0}
guard = "i < 29"
assertion = "error == 0"

[[benchmark.dynamics]]
region = "true"
branches = [
  {prob = "1/1000",   update = {error = "1"}},
  {prob = "999/2000", update = {i = "i + 1"}},
  {prob = "999/2000", update = {}},
]

[benchmark.farkas]
published = "0.0561"
grid = {i = [0, 29], error = [0, 1]}
invariant = "0 <= i && i <= 29"
target = "error >= 1"
objective = {i = 1, error = 0}
note = "Y-frame. Expected optimum 56/999."

[benchmark.truth]
method = "chain"
