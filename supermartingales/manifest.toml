# benchmark manifest — arXiv 2301.06136 (Abate–Edwards–Giacobbe–Punchihewa–Roy,
# "Quantitative Verification with Neural Networks", LMCS 22(2), 2026; v7 e-print 2026-04-14)
#
# TRANSCRIPTION PROVENANCE: extracted from the fetched TeX source
# (sources/2301.06136/main.tex) — Table 1 = \label{tab:results} (bounds/success/arch),
# Table 2 = \label{tab:timings-main} (timings, seconds). Extraction method: awk range
# over the table env + sed cell split (scratchpad t1.txt/t2.txt), hand-merged here, then
# self-checked by re-diffing this file's rows against the mechanical extraction (row
# count 17=17 both tables; name order identical; all cells byte-compared).
# NOTE the campaign brief said "Table 2": in the published LMCS numbering Table 2 is the TIMINGS
# table; the campaign gloss ("their bound, their timing") spans both tables over the
# SAME 17-row benchmark set, so this manifest carries the union, keyed by benchmark.
#
# SOURCE ANOMALY (transcribed as-is): faulty_loop and faulty_rare both list
# program-agnostic learn time 25.52 s in their source — suspicious duplicate in the
# upstream LaTeX, not a transcription error here.
#
# Fields per row:
#   farkas_bound            — their linear-template (Farkas' Lemma) upper bound p; "none" = no linear SM exists
#   pa_bound / pa_success   — program-agnostic neural bound (avg over successes) + success ratio (of 10)
#   pw_bound / pw_success   — program-aware neural bound + success ratio
#   arch                    — hidden-layer widths of their neural certificate
#   farkas_time_s, pa_learn_s, pa_verify_s, pw_learn_s, pw_verify_s — Table 2 timings (A40 GPU + Z3)
#   family                  — their taxonomy: unreliable_hardware | robot_motion
#   section                 — their Table-1 grouping: 1 = Farkas inapplicable, 2 = Farkas beaten, 3 = comparable
#   definition_status       — listed_verbatim (in-paper lstlisting) | reconstruct (no public source; see PLAN)
#   dynamics_class          — recon's model-class read (verify in wave 0)
#   noise                   — randomness constructs used
#
# All 17 rows are DISCRETE-TIME. No continuous-time rows exist in this table.

