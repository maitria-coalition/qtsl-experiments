# qtsl-experiments workspace: thin CLI wrappers around the checker
# libraries imported from the companion qtsl repository (Cargo git
# references; the committed Cargo.lock pins the exact revisions).
[workspace]
resolver = "2"
members = [
    "checkers/flcheck-cli",
    "checkers/fluidcheck-cli",
    "gymnasium/atari/harness/simreplay",
    "probprog/producer",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
lto = true
codegen-units = 1
