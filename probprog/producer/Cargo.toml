[package]
name = "probprog-producer"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Exact-rational residual-mass posterior certificates for discrete probabilistic programs (untrusted producer)"

[dependencies]
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"

[[bin]]
name = "probprog-produce"
path = "src/main.rs"
